# Categories for GitHub's autogenerated release notes (`gh release create --generate-notes`).
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New formats
      labels: [format]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Security and supply chain
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
