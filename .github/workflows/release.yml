name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: |
          mkdir -p dist/release
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/release/einvoice-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/release/einvoice-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/release/einvoice-windows-x64.exe
      - name: Smoke-test the Linux binary
        run: dist/release/einvoice-linux-x64 detect test/fixtures/peppol-bis3-invoice.xml
      - name: Checksums
        run: cd dist/release && sha256sum einvoice-* > SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
