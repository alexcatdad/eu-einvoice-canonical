name: Release

# Tag push (v*): builds the standalone CLI binaries, writes SHA256SUMS and a CycloneDX SBOM, signs build
# provenance attestations for all of them and attaches everything to the GitHub release.
# Nothing is published to npm. How to verify a download: docs/SUPPLY-CHAIN.md.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: |
          mkdir -p dist/release
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/release/einvoice-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/release/einvoice-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/release/einvoice-windows-x64.exe
          bun build --compile --target=bun-linux-x64 src/trust-lists-cli.ts --outfile dist/release/einvoice-trust-lists-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/trust-lists-cli.ts --outfile dist/release/einvoice-trust-lists-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/trust-lists-cli.ts --outfile dist/release/einvoice-trust-lists-windows-x64.exe
      - name: Smoke-test the Linux binaries
        run: |
          dist/release/einvoice-linux-x64 detect test/fixtures/peppol-bis3-invoice.xml
          dist/release/einvoice-trust-lists-linux-x64 --help
      - name: SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/release/einvoice-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd dist/release && sha256sum einvoice-* > SHA256SUMS
      - name: Attest build provenance (binaries, SBOM and checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/einvoice-*
            dist/release/SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
