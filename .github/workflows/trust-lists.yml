name: Refresh EU trust-list snapshot

# Fetches the EU List of Trusted Lists and the national lists, verifies every list's signature and opens a pull
# request when the snapshot in trust/ changed. Never runs on a pull request: tests use generated lists only.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Fetch and verify the lists
        run: bun src/cli.ts trust-lists update --out trust/eu-trust-snapshot.json
      - name: Open a pull request when the snapshot changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- trust/eu-trust-snapshot.json && exit 0
          branch="trust-lists/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add trust/eu-trust-snapshot.json
          git commit -m "Refresh the EU trust-list snapshot"
          git push origin "$branch"
          gh pr create --title "Refresh the EU trust-list snapshot" --body "Fetched and signature-verified by the trust-lists workflow."
