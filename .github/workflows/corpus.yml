name: Public corpora

# Public sample collections: weekly and on demand, never on a pull request.
# 1. coverage: every file under the corpora goes through detection (what is found, what is unknown)
# 2. correctness: a manifest of files whose format is clear from their folder must all match
# 3. real-world run: every file is converted with validation and line relations, and the report
#    (artifact corpus-report) feeds the Real-world results page of the site (scripts/fetch-corpus-report.sh)
# The clones are pinned in scripts/fetch-corpora.sh; licences are recorded in test/corpus/SOURCES.md.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Restore pinned corpus clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/corpus/repos
          key: corpus-${{ runner.os }}-${{ hashFiles('scripts/fetch-corpora.sh') }}
          restore-keys: corpus-${{ runner.os }}-
      - name: Fetch the corpora at their pinned commits
        run: scripts/fetch-corpora.sh test/corpus/repos | tee corpus-pins.txt
      - name: Coverage sweep (never fails the job)
        run: bun scripts/sweep.ts test/corpus/repos | tee corpus-report.txt
      - name: Known-answer sweep
        if: always()
        run: bun scripts/sweep.ts --expect test/corpus/expected.json | tee corpus-expect.txt
      - name: Real-world run (convert every file, 60 s per file)
        run: bun scripts/corpus-run.ts test/corpus/repos --out dist/corpus-report.json --details dist/corpus-details.ndjson --md dist/corpus-report.md --pins corpus-pins.txt --jobs 4 --timeout 60 > corpus-run.log
      - name: Summary
        if: always()
        run: |
          {
            [ -f dist/corpus-report.md ] && cat dist/corpus-report.md
            echo '## Public corpora'
            echo '### Pinned commits'; echo '```'; cat corpus-pins.txt; echo '```'
            echo '### Known answers'; echo '```'; tail -n 40 corpus-expect.txt; echo '```'
            echo '### Coverage (counts per format)'; echo '```'; head -n 200 corpus-report.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report the site page is built from
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report
          path: |
            dist/corpus-report.json
            dist/corpus-report.md
          if-no-files-found: warn
      - name: Upload per-file results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-details
          path: dist/corpus-details.ndjson
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-reports
          path: |
            corpus-pins.txt
            corpus-report.txt
            corpus-expect.txt
            corpus-run.log
