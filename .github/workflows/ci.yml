name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Library checks (same command locally and in CI)
        run: bun run check:lib
      - name: HuJSON consumer example (no model requests)
        run: bun scripts/check-line-annotations.ts
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install the site's dependencies (Astro, Starlight, TypeDoc, React; its own package)
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Latest corpus report for the Real-world results page (when there is one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-corpus-report.sh
      - name: Site build, typecheck and performance gate
        run: bun run check:site
      - name: Upload the quick benchmark run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-quick
          path: bench/last-quick.json
          if-no-files-found: ignore
      - name: Install the headless browser
        working-directory: site
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Accessibility and privacy gate
        run: bun run check:a11y
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -t einvoice-api .
      - name: Run it read-only and call the API
        run: |
          docker run -d --name api --read-only -p 8080:8080 einvoice-api
          for _ in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          curl -sf localhost:8080/v1/formats | grep -q peppol-bis3
          curl -sf -X POST -H 'Content-Type: application/xml' --data-binary @test/fixtures/peppol-bis3-invoice.xml localhost:8080/v1/convert | grep -q '"status":"ok"'
          curl -sf -X POST -H 'Content-Type: application/xml' --data-binary @test/fixtures/peppol-bis3-invoice.xml 'localhost:8080/v1/convert?euTrust=true' | grep -q '"status":"ok"'
      - name: Logs
        if: failure()
        run: docker logs api

  test:
    needs: [library, site, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success"

  deploy:
    needs: [test, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
