name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload coverage to GitHub for the "Restrict code coverage" ruleset.
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Coverage line numbers must match the PR head that GitHub shows, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit, parser and hostile-input tests (with coverage)
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Coverage gate (and Cobertura report for GitHub)
        run: bun run coverage:check -- --cobertura coverage/cobertura.xml
      - name: Upload coverage to GitHub
        if: always() && hashFiles('coverage/cobertura.xml') != ''
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: TypeScript
          label: code-coverage/bun
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/cobertura.xml
          if-no-files-found: ignore
      - name: Known-answer detection sweep over the fixtures
        run: bun run sweep:fixtures
      - name: Build the browser converter
        run: bun run build:site
      - name: Conformance checklist (job summary and site page)
        run: bun scripts/conformance.ts --html dist/conformance.html --json dist/conformance.json
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
