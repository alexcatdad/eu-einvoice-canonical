name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint and formatting (Biome)
        run: bun run lint:ci
      - name: JSON Schemas are up to date
        run: bun run check:schemas
      - name: Typecheck
        run: bun run typecheck
      - name: Verify the pinned validator bundles
        run: bun run verify:bundles
      - name: Unit, parser and hostile-input tests (with coverage)
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Coverage gate
        run: bun run coverage:check
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Known-answer detection sweep over the fixtures
        run: bun run sweep:fixtures
      - name: Install TypeDoc (its own package, because it needs the JavaScript TypeScript compiler)
        run: bun install --frozen-lockfile
        working-directory: typedoc
      - name: Build the site (browser converter, API reference, TypeDoc)
        run: bun run build:site
      - name: Conformance checklist (job summary and site page)
        run: bun scripts/conformance.ts --html dist/conformance.html --json dist/conformance.json
      - name: Real-world results page (latest corpus report, when there is one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-corpus-report.sh dist
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build -t einvoice-api .
      - name: Run it read-only and call the API
        run: |
          docker run -d --name api --read-only -p 8080:8080 einvoice-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          curl -sf localhost:8080/v1/formats | grep -q peppol-bis3
          curl -sf -X POST -H 'Content-Type: application/xml' --data-binary @test/fixtures/peppol-bis3-invoice.xml localhost:8080/v1/convert | grep -q '"status":"ok"'
          curl -sf -X POST -H 'Content-Type: application/xml' --data-binary @test/fixtures/peppol-bis3-invoice.xml 'localhost:8080/v1/convert?euTrust=true' | grep -q '"status":"ok"'
      - name: Logs
        if: failure()
        run: docker logs api

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
